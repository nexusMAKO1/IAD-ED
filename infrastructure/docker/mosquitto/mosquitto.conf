# =============================================================================
# Mosquitto MQTT Broker — Configuration
# Eclipse Mosquitto 2.0
# =============================================================================

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---------------------------------------------------------------------------
# Security — Port 1883 (MQTT avec authentification)
# ---------------------------------------------------------------------------
listener 1883
protocol mqtt

# Exiger une authentification (pas d'anonymous)
allow_anonymous false
password_file /mosquitto/config/passwd

# ---------------------------------------------------------------------------
# WebSocket — Port 9001 (pour les clients navigateur)
# ---------------------------------------------------------------------------
listener 9001
protocol websockets

# ---------------------------------------------------------------------------
# Limites de connexion
# ---------------------------------------------------------------------------
max_connections 100
max_inflight_messages 20
max_queued_messages 1000

# Keepalive

# ---------------------------------------------------------------------------
# Topics ACL (Access Control List)
# ---------------------------------------------------------------------------
# Configurer un fichier ACL pour restreindre les topics par utilisateur
# acl_file /mosquitto/config/acl
