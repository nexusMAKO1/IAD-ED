name: CI — IAD & SmartQueue AI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/iad

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & Type-check Backend
  # ---------------------------------------------------------------------------
  lint-backend:
    name: 🔍 Lint Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npm run type-check

  # ---------------------------------------------------------------------------
  # Job 2: Lint & Type-check Frontend
  # ---------------------------------------------------------------------------
  lint-frontend:
    name: 🔍 Lint Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npm run type-check

  # ---------------------------------------------------------------------------
  # Job 3: Lint Python services
  # ---------------------------------------------------------------------------
  lint-python:
    name: 🔍 Lint Python Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [edge-cv, smartqueue-ml]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: apps/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: apps/${{ matrix.service }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run Ruff (linter + formatter check)
        working-directory: apps/${{ matrix.service }}
        run: ruff check . && ruff format --check .

      - name: Run mypy (type checking)
        working-directory: apps/${{ matrix.service }}
        run: mypy app/ --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # Job 4: Backend tests
  # ---------------------------------------------------------------------------
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    needs: [lint-backend]

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: iad_test
          POSTGRES_USER: iad_test_user
          POSTGRES_PASSWORD: test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://iad_test_user:test_password_ci@localhost:5432/iad_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ci_test_jwt_secret_must_be_at_least_64_chars_long_for_security_purposes
      JWT_EXPIRES_IN: 3600s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm run test:ci

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 5: Python service tests
  # ---------------------------------------------------------------------------
  test-python:
    name: 🧪 Test Python Services
    runs-on: ubuntu-latest
    needs: [lint-python]
    strategy:
      matrix:
        service: [edge-cv, smartqueue-ml]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: apps/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: apps/${{ matrix.service }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run pytest
        working-directory: apps/${{ matrix.service }}
        env:
          MODEL_SKIP_LOAD: "true"
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-coverage
          path: apps/${{ matrix.service }}/coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 6: Build Docker images (sur main et develop seulement)
  # ---------------------------------------------------------------------------
  build-images:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-python, lint-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: backend
            context: apps/backend
            image: backend
          - service: frontend
            context: apps/frontend
            image: frontend
          - service: edge-cv
            context: apps/edge-cv
            image: edge-cv
          - service: smartqueue-ml
            context: apps/smartqueue-ml
            image: smartqueue-ml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Job 7: Security scan (Trivy)
  # ---------------------------------------------------------------------------
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on repo
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
