# =============================================================================
# IAD & SmartQueue AI — Docker Compose
# Express Display — Backend/DevOps/CV Infrastructure
# =============================================================================

version: "3.9"

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  iad_core:
    driver: bridge
    name: iad_core
  iad_monitoring:
    driver: bridge
    name: iad_monitoring

# ---------------------------------------------------------------------------
# Named volumes (persistent data)
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  minio_data:
  mosquitto_data:
  mosquitto_log:
  prometheus_data:
  grafana_data:

# ===========================================================================
# SERVICES
# ===========================================================================
services:

  # -------------------------------------------------------------------------
  # PostgreSQL 16 + TimescaleDB
  # -------------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: iad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iad_core

  # -------------------------------------------------------------------------
  # Redis (Cache & Pub/Sub)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: iad_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - iad_core

  # -------------------------------------------------------------------------
  # Mosquitto MQTT Broker
  # -------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iad_mosquitto
    restart: unless-stopped
    environment:
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9003}:9001"
    volumes:
      - ./infrastructure/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/docker/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u $$MQTT_USER -P $$MQTT_PASSWORD -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - iad_core

  # -------------------------------------------------------------------------
  # MinIO (Object Storage — vidéos, modèles, assets CV)
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-11T07-46-16Z
    container_name: iad_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD 2>/dev/null && mc ready local 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - iad_core

  # -------------------------------------------------------------------------
  # NestJS Backend
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: iad_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MQTT_HOST: mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600s}
      JWT_REFRESH_SECRET: ${JWT_SECRET}
      JWT_REFRESH_EXPIRES_IN: 7d
      MQTT_URL: mqtt://mosquitto:${MQTT_PORT:-1883}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CV_SERVICE_URL: http://edge-cv:8001
      ML_SERVICE_URL: http://smartqueue-ml:8002
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - iad_core

  # -------------------------------------------------------------------------
  # React Frontend (Vite + TypeScript)
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: development
    container_name: iad_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_MQTT_WS_URL: ${VITE_MQTT_WS_URL:-ws://localhost:9003}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - iad_core

  # -------------------------------------------------------------------------
  # Edge CV — Computer Vision Service (FastAPI + YOLOv8)
  # -------------------------------------------------------------------------
  edge-cv:
    build:
      context: ./apps/edge-cv
      dockerfile: Dockerfile
      target: development
    container_name: iad_edge_cv
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      LOG_LEVEL: ${CV_LOG_LEVEL:-INFO}
      MODEL_PATH: /app/yolov8n.pt
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MQTT_HOST: mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MAX_WORKERS: ${CV_MAX_WORKERS:-2}
    ports:
      - "${CV_PORT:-8001}:8001"
    volumes:
      - ./apps/edge-cv:/app
      - ./data/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - iad_core

  # -------------------------------------------------------------------------
  # SmartQueue ML — Machine Learning Service (FastAPI + scikit-learn)
  # -------------------------------------------------------------------------
  smartqueue-ml:
    build:
      context: ./apps/smartqueue-ml
      dockerfile: Dockerfile
      target: development
    container_name: iad_smartqueue_ml
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      LOG_LEVEL: ${ML_LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MODEL_STORE_PATH: /app/model_store
    ports:
      - "${ML_PORT:-8002}:8002"
    volumes:
      - ./apps/smartqueue-ml:/app
      - ./data/model_store:/app/model_store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - iad_core

  # -------------------------------------------------------------------------
  # Monitoring Exporters
  # -------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: iad_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - iad_core
      - iad_monitoring

  redis-exporter:
    image: oliver006/redis_exporter
    container_name: iad_redis_exporter
    restart: unless-stopped
    command:
      - '-redis.addr=redis://redis:6379'
      - '-redis.password=${REDIS_PASSWORD}'
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - iad_core
      - iad_monitoring

  mosquitto-exporter:
    image: sapcc/mosquitto-exporter
    platform: linux/amd64
    container_name: iad_mosquitto_exporter
    restart: unless-stopped
    environment:
      BROKER_ENDPOINT: "tcp://mosquitto:1883"
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASSWORD}
    ports:
      - "9234:9234"
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - iad_core
      - iad_monitoring

  # -------------------------------------------------------------------------
  # Prometheus (Metrics Scraping)
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: iad_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - iad_core
      - iad_monitoring

  # -------------------------------------------------------------------------
  # Grafana (Dashboards & Alerting)
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: iad_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
      GF_SMTP_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iad_monitoring
